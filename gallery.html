<!DOCTYPE html>

    <title>KDMN Studio Group - Digital Innovation</title>
    <link rel="icon" href="images/logo.png" type="image/jpeg">
    <link rel="stylesheet" href="styles/index.css">

<body>
    <!-- Auto-hiding Navigation Bar -->
    <nav class="navbar grainy-texture" id="navbar">
        <div class="navbar-content">
            <div class="navbar-logo">KDMN Studio</div>

            <input class="side-menu" type="checkbox" id="side-menu"/>

            <ul class="navbar-links menu">
